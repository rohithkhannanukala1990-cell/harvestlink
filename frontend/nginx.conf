# Nginx config for the Harvestlink SPA.
# Serves Vite build output and rewrites unknown paths to index.html for React Router.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed assets aggressively; HTML stays revalidated.
  location /assets/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
